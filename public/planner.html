<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Social Planner</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A3%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <h1>Social Planner</h1>
        <nav class="viewnav">
          <a href="/">Board</a>
          <a href="/planner.html" class="active">Planner</a>
        </nav>
      </div>
      <div class="topbar-right">
        <div class="filters" id="tabs">
          <button class="chip active" data-tab="calendar">Calendar</button>
          <button class="chip" data-tab="queue">Queue</button>
          <button class="chip" data-tab="photos">Photos</button>
          <button class="chip" data-tab="accounts">Accounts</button>
        </div>
        <button class="btn primary" id="new-post-btn">+ New post</button>
      </div>
    </header>

    <!-- CALENDAR -->
    <section class="planner-view" id="calendar-view">
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button class="icon-btn" id="cal-prev" aria-label="Previous month">‹</button>
          <button class="icon-btn" id="cal-next" aria-label="Next month">›</button>
          <button class="btn ghost small" id="cal-today">Today</button>
        </div>
        <h2 class="cal-title" id="cal-title"></h2>
        <div class="cal-legend">
          <span class="legend-dot s-needs_approval"></span> Needs approval
          <span class="legend-dot s-scheduled"></span> Scheduled
          <span class="legend-dot s-posted"></span> Posted
        </div>
      </div>
      <div class="cal-weekdays" id="cal-weekdays"></div>
      <div class="cal-grid" id="cal-grid"></div>
    </section>

    <!-- QUEUE -->
    <section class="planner-view" id="queue-view" hidden>
      <div class="queue" id="queue"></div>
    </section>

    <!-- PHOTOS -->
    <section class="planner-view panel" id="photos-view" hidden>
      <div class="panel-head">
        <h2>Photo library</h2>
        <label class="btn primary upload-label">
          + Upload photos
          <input type="file" id="photo-input" accept="image/*" multiple hidden />
        </label>
      </div>
      <p class="muted" id="upload-status"></p>
      <div class="photo-grid" id="photo-grid"></div>
    </section>

    <!-- ACCOUNTS -->
    <section class="planner-view panel" id="accounts-view" hidden>
      <div class="panel-head"><h2>Connected accounts</h2></div>
      <p class="muted">
        Set the handle you post as. Live posting is wired up later — actual account
        tokens are stored securely on the server, never here.
      </p>
      <div id="accounts-list"></div>
    </section>

    <!-- Compose / detail modal -->
    <div class="modal-backdrop" id="compose-backdrop" hidden>
      <div class="modal composer" role="dialog" aria-modal="true">
        <div class="composer-head">
          <h2 class="modal-heading" id="compose-heading">New post</h2>
          <span class="status-pill" id="compose-status" hidden></span>
          <button class="icon-btn close" id="compose-x" aria-label="Close">✕</button>
        </div>

        <div class="composer-body">
          <div class="composer-form">
            <label class="field-label">Post to</label>
            <div class="platform-picker" id="platform-picker"></div>

            <label class="field-label">Post text</label>
            <textarea id="compose-text" class="modal-description" rows="6" placeholder="Write your post…"></textarea>
            <div class="compose-meta">
              <span id="char-count" class="muted"></span>
              <span id="platform-warning" class="warn"></span>
            </div>

            <label class="field-label">Photos</label>
            <div class="attach-strip" id="attach-strip"></div>
            <button type="button" class="btn ghost small" id="attach-btn">+ Attach from library</button>

            <div class="modal-row">
              <label class="field">
                <span class="field-label">Schedule for</span>
                <input type="datetime-local" id="compose-schedule" />
              </label>
            </div>

            <label class="field-label">Notes (not posted)</label>
            <input type="text" id="compose-notes" class="text-input" placeholder="Internal note…" />
          </div>

          <div class="composer-preview">
            <div class="preview-label">Preview</div>
            <div id="compose-preview"></div>
          </div>
        </div>

        <div class="modal-actions" id="compose-actions"></div>
      </div>
    </div>

    <!-- Photo picker modal -->
    <div class="modal-backdrop" id="picker-backdrop" hidden>
      <div class="modal wide" role="dialog" aria-modal="true">
        <h2 class="modal-heading">Attach photos</h2>
        <div class="photo-grid" id="picker-grid"></div>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button class="btn primary" id="picker-done">Done</button>
        </div>
      </div>
    </div>

    <script src="/planner.js"></script>
  </body>
</html>
